base_config: train_soft_local.yaml
probe:
  trajectory: center_deep
  frame: 71
  node_rest_position: [0.0, 0.0, 0.03]
  adam_steps: 2000
  gradient_steps: [0, 1, 10, 100, 500, 2000]
  log_interval: 500
  # Fitting diagnostics on the SAME samples only.
  required_rmse_reduction: 0.9
  finite_difference_epsilon: 0.00001
  finite_difference_relative_tolerance: 0.0001
  finite_difference_absolute_tolerance: 0.0000000001
  # Optimizer-only control, from the same seed/zero output, same float32 MLP/loss.
  lbfgs_steps: 100
  lbfgs_max_iter: 20
  lbfgs_max_eval: 25
  lbfgs_history_size: 50
  lbfgs_learning_rate: 1.0
  lbfgs_tolerance_grad: 0.000000000001
  lbfgs_tolerance_change: 0.000000000000001
